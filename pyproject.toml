[project]
name = "antiloop-watchdog"
version = "1.0.0"
description = "Independent anti-loop watchdog for local LLM agent sessions (Hermes + llama.cpp/Strata)"
requires-python = ">=3.9"
dependencies = []          # runtime is standard library only

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-q"
